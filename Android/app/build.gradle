apply plugin: 'com.android.application'

android {
    namespace = 'com.cns.encom'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.cns.encom"
        minSdk = 21
        targetSdk = 36
        versionCode = 9
        versionName = "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // libstreaming (RTSP server + H.264 encoder glue) is vendored source,
    // compiled straight into the app: one module, no AAR/lint tooling needed.
    sourceSets {
        main {
            java.srcDirs += ['../libstreaming/app/src/main/java']
        }
    }

    lint {
        abortOnError = false
    }
}

// No AndroidX/support libraries: the UI uses framework widgets only, which
// keeps the APK small and the build free of extra downloads.
